_format_version: "3.0"
_transform: true

services:
  - name: upstream-service
    url: http://upstream-app:80
    routes:
      - name: upstream-route
        paths:
          - /api
        strip_path: false
    plugins:
      - name: jwt
        config:
          header_names:
            - authorization
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
          exposed_headers:
            - X-Request-Id
          credentials: true
          max_age: 3600

consumers:
  - username: app-user
    jwt_secrets:
      - algorithm: HS256
        key: ${APP_USER_JWT_KEY}
        secret: ${APP_USER_JWT_SECRET}

basicauth_credentials: []
hmacauth_credentials: []
keyauth_credentials: []
oauth2_credentials: []
acls: []